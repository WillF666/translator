<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>实时同传翻译</title>
  <style>
    :root {
      --bg: #0c0f14;
      --bg-elev: #151a22;
      --bg-elev-2: #1c232e;
      --line: #2a3342;
      --text: #e8eaed;
      --muted: #8b93a0;
      --faint: #5c6573;
      --accent: #4aa3ff;
      --accent-soft: rgba(74, 163, 255, 0.14);
      --live: #3ecf8e;
      --live-soft: rgba(62, 207, 142, 0.16);
      --warn: #f0b429;
      --danger: #f07178;
      --danger-soft: rgba(240, 113, 120, 0.14);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(74, 163, 255, 0.08), transparent 50%),
        radial-gradient(800px 400px at 100% 0%, rgba(62, 207, 142, 0.05), transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100%;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--faint);
      box-shadow: 0 0 0 0 rgba(62, 207, 142, 0.0);
    }
    .status-chip.listening {
      color: var(--live);
      border-color: rgba(62, 207, 142, 0.35);
      background: var(--live-soft);
    }
    .status-chip.listening .dot {
      background: var(--live);
      animation: pulse 1.4s ease-out infinite;
    }
    .status-chip.error {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.4);
      background: var(--danger-soft);
    }
    .status-chip.error .dot { background: var(--danger); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(62, 207, 142, 0.7); }
      100% { box-shadow: 0 0 0 10px rgba(62, 207, 142, 0); }
    }

    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lang-row {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 140px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    select, button {
      font-family: inherit;
    }
    select {
      appearance: none;
      background: var(--bg-elev-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238b93a0' d='M1 1l5 5 5-5'/></svg>") no-repeat right 12px center;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 36px 10px 12px;
      font-size: 16px;
      outline: none;
      width: 100%;
    }
    select:focus, button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .swap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-elev-2);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      flex: 0 0 auto;
      margin-bottom: 1px;
    }
    .swap:hover { background: #242c39; }

    .presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip-btn {
      border: 1px solid var(--line);
      background: var(--bg-elev-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip-btn.active {
      color: var(--accent);
      border-color: rgba(74, 163, 255, 0.45);
      background: var(--accent-soft);
    }
    .chip-btn:hover { color: var(--text); }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--bg-elev-2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: #242c39; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #061018;
      font-weight: 700;
      font-size: 16px;
      padding: 12px 22px;
    }
    .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
    .btn-primary.stop {
      background: var(--danger);
      color: #1a0608;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-left: auto;
      user-select: none;
      cursor: pointer;
    }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

    .note, .error-banner {
      font-size: 13px;
      color: var(--muted);
    }
    .note code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      background: var(--bg-elev-2);
      padding: 1px 6px;
      border-radius: 6px;
    }
    .error-banner {
      display: none;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid rgba(240, 113, 120, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .error-banner.show { display: block; }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 420px;
      padding: 0;
      overflow: hidden;
    }
    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    #engineHint { color: var(--faint); }

    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pair {
      padding: 14px 16px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .pair .src, .pair .dst, .live .src, .live .dst {
      display: block;
    }
    .lbl {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--faint);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .src {
      font-size: 20px;
      color: var(--text);
      font-weight: 500;
    }
    .dst {
      margin-top: 8px;
      font-size: 22px;
      color: #cfe3ff;
      font-weight: 600;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--faint);
      padding: 48px 16px;
      font-size: 16px;
    }

    .live {
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      background: linear-gradient(180deg, rgba(74, 163, 255, 0.04), transparent 80%);
      min-height: 108px;
    }
    .live.idle .src, .live.idle .dst { color: var(--faint); font-weight: 400; font-size: 16px; }
    .live .src { color: var(--muted); }
    .live .dst {
      color: var(--muted);
      font-weight: 500;
      font-style: italic;
    }
    .live.has-text .dst.pending { opacity: 0.75; }

    footer {
      color: var(--faint);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app { padding: 16px 12px 24px; }
      .brand h1 { font-size: 22px; }
      .src { font-size: 18px; }
      .dst { font-size: 20px; }
      .toggle { margin-left: 0; }
      header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>实时同传翻译</h1>
        <p>对着麦克风说话，译文会边说边出来</p>
      </div>
      <div id="statusChip" class="status-chip" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">未开始</span>
      </div>
    </header>

    <section class="panel controls">
      <div class="lang-row">
        <div class="field">
          <label for="sourceLang">源语言（说的语言）</label>
          <select id="sourceLang"></select>
        </div>
        <button type="button" class="swap" id="swapBtn" title="交换语言" aria-label="交换源语言和目标语言">⇄</button>
        <div class="field">
          <label for="targetLang">目标语言（译文）</label>
          <select id="targetLang"></select>
        </div>
      </div>

      <div class="presets" role="group" aria-label="快捷方向">
        <button type="button" class="chip-btn active" data-from="zh-CN" data-to="en" id="presetZhEn">中文 → 英文</button>
        <button type="button" class="chip-btn" data-from="en" data-to="zh-CN" id="presetEnZh">英文 → 中文</button>
      </div>

      <div class="action-row">
        <button type="button" class="btn btn-primary" id="toggleBtn">开始同传</button>
        <button type="button" class="btn" id="clearBtn">清空记录</button>
        <button type="button" class="btn" id="copyBtn">复制译文</button>
        <button type="button" class="btn" id="exportBtn">导出记录</button>
        <label class="toggle">
          <input type="checkbox" id="speakToggle" />
          朗读译文
        </label>
      </div>

      <div id="errorBanner" class="error-banner" role="alert"></div>
      <p class="note">
        请使用 <strong>Chrome</strong> 或 <strong>Edge</strong> 打开。语音识别需要
        <strong>HTTPS</strong>、<strong>localhost</strong>，或用 Chrome 直接打开本文件。
        首次使用请允许麦克风权限。识别与翻译都需要联网。
      </p>
    </section>

    <section class="panel stage">
      <div class="stage-head">
        <span>同传记录</span>
        <span id="engineHint"></span>
      </div>
      <div id="transcript" class="transcript">
        <div class="empty" id="emptyHint">点击「开始同传」，然后开始说话。</div>
      </div>
      <div class="live idle" id="liveBox">
        <div class="lbl">正在识别</div>
        <div class="src" id="liveSrc">等待语音…</div>
        <div class="lbl" style="margin-top:10px">即时译文</div>
        <div class="dst" id="liveDst">—</div>
      </div>
    </section>

    <footer>
      语音识别由浏览器提供（Chrome 会将音频发送至 Google）。翻译使用公开接口，无需密钥。本页不会把内容保存到服务器。
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var LANGS = [
        { id: "zh-CN", speech: "zh-CN", name: "中文" },
        { id: "en", speech: "en-US", name: "英文" },
        { id: "ja", speech: "ja-JP", name: "日语" },
        { id: "ko", speech: "ko-KR", name: "韩语" },
        { id: "fr", speech: "fr-FR", name: "法语" },
        { id: "es", speech: "es-ES", name: "西班牙语" }
      ];

      var sourceSel = document.getElementById("sourceLang");
      var targetSel = document.getElementById("targetLang");
      var swapBtn = document.getElementById("swapBtn");
      var toggleBtn = document.getElementById("toggleBtn");
      var clearBtn = document.getElementById("clearBtn");
      var copyBtn = document.getElementById("copyBtn");
      var exportBtn = document.getElementById("exportBtn");
      var speakToggle = document.getElementById("speakToggle");
      var statusChip = document.getElementById("statusChip");
      var statusText = document.getElementById("statusText");
      var errorBanner = document.getElementById("errorBanner");
      var transcriptEl = document.getElementById("transcript");
      var emptyHint = document.getElementById("emptyHint");
      var liveBox = document.getElementById("liveBox");
      var liveSrc = document.getElementById("liveSrc");
      var liveDst = document.getElementById("liveDst");
      var engineHint = document.getElementById("engineHint");
      var presetZhEn = document.getElementById("presetZhEn");
      var presetEnZh = document.getElementById("presetEnZh");

      LANGS.forEach(function (lang) {
        var o1 = document.createElement("option");
        o1.value = lang.id;
        o1.textContent = lang.name;
        sourceSel.appendChild(o1);
        var o2 = document.createElement("option");
        o2.value = lang.id;
        o2.textContent = lang.name;
        targetSel.appendChild(o2);
      });
      sourceSel.value = "zh-CN";
      targetSel.value = "en";

      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = null;
      var running = false;
      var restartTimer = null;
      var debounceTimer = null;
      var translateSeq = 0;
      var lastInterimText = "";
      var lastInterimTranslation = "";
      var lines = [];
      var skippedEngines = {};
      var activeEngineName = "";

      var ENGINES = [
        {
          name: "Google",
          id: "clients5",
          translate: function (text, sl, tl) {
            var url =
              "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=" +
              encodeURIComponent(sl) +
              "&tl=" +
              encodeURIComponent(tl) +
              "&q=" +
              encodeURIComponent(text);
            return fetch(url).then(function (res) {
              if (!res.ok) throw new Error("clients5 " + res.status);
              return res.json();
            }).then(parseGoogleClients5);
          }
        },
        {
          name: "MyMemory",
          id: "mymemory",
          translate: function (text, sl, tl) {
            var url =
              "https://api.mymemory.translated.net/get?q=" +
              encodeURIComponent(text) +
              "&langpair=" +
              encodeURIComponent(sl) +
              "|" +
              encodeURIComponent(tl);
            return fetch(url).then(function (res) {
              if (!res.ok) throw new Error("mymemory " + res.status);
              return res.json();
            }).then(function (data) {
              var t = data && data.responseData && data.responseData.translatedText;
              if (data.responseStatus !== 200 || !t) {
                throw new Error("mymemory bad payload");
              }
              if (/^MYMEMORY WARNING/i.test(t) || /^INVALID /i.test(t)) {
                throw new Error(t);
              }
              return t;
            });
          }
        },
        {
          name: "Google gtx",
          id: "gtx",
          translate: function (text, sl, tl) {
            var url =
              "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
              encodeURIComponent(sl) +
              "&tl=" +
              encodeURIComponent(tl) +
              "&dt=t&q=" +
              encodeURIComponent(text);
            return fetch(url).then(function (res) {
              if (!res.ok) throw new Error("gtx " + res.status);
              return res.json();
            }).then(function (data) {
              if (!data || !data[0]) throw new Error("gtx empty");
              return data[0].map(function (seg) { return seg[0] || ""; }).join("");
            });
          }
        }
      ];

      function parseGoogleClients5(data) {
        if (typeof data === "string") return data;
        if (!Array.isArray(data)) throw new Error("clients5 unexpected");
        if (typeof data[0] === "string") return data[0];
        return data.map(function (item) {
          if (typeof item === "string") return item;
          if (Array.isArray(item)) return item[0] || "";
          return "";
        }).join("");
      }

      function showError(msg) {
        if (!msg) {
          errorBanner.classList.remove("show");
          errorBanner.textContent = "";
          return;
        }
        errorBanner.textContent = msg;
        errorBanner.classList.add("show");
      }

      function setStatus(mode, text) {
        statusChip.classList.remove("listening", "error");
        if (mode) statusChip.classList.add(mode);
        statusText.textContent = text;
      }

      function langName(id) {
        var found = LANGS.filter(function (l) { return l.id === id; })[0];
        return found ? found.name : id;
      }

      function speechCode(id) {
        var found = LANGS.filter(function (l) { return l.id === id; })[0];
        return found ? found.speech : id;
      }

      function updatePresets() {
        var from = sourceSel.value;
        var to = targetSel.value;
        presetZhEn.classList.toggle("active", from === "zh-CN" && to === "en");
        presetEnZh.classList.toggle("active", from === "en" && to === "zh-CN");
      }

      function applyPair(from, to) {
        sourceSel.value = from;
        targetSel.value = to;
        updatePresets();
        if (running && recognition) {
          try { recognition.stop(); } catch (e) {}
        }
      }

      sourceSel.addEventListener("change", function () {
        updatePresets();
        if (running && recognition) {
          try { recognition.stop(); } catch (e) {}
        }
      });
      targetSel.addEventListener("change", updatePresets);
      presetZhEn.addEventListener("click", function () { applyPair("zh-CN", "en"); });
      presetEnZh.addEventListener("click", function () { applyPair("en", "zh-CN"); });
      swapBtn.addEventListener("click", function () {
        var a = sourceSel.value;
        sourceSel.value = targetSel.value;
        targetSel.value = a;
        updatePresets();
        if (running && recognition) {
          try { recognition.stop(); } catch (e) {}
        }
      });

      function translateText(text) {
        var sl = sourceSel.value;
        var tl = targetSel.value;
        var trimmed = (text || "").trim();
        if (!trimmed) return Promise.resolve("");
        if (sl === tl) return Promise.resolve(trimmed);

        var chain = Promise.reject(new Error("start"));
        ENGINES.forEach(function (engine) {
          chain = chain.catch(function () {
            if (skippedEngines[engine.id]) {
              return Promise.reject(new Error("skipped " + engine.id));
            }
            return engine.translate(trimmed, sl, tl).then(function (out) {
              var result = (out || "").trim();
              if (!result) throw new Error(engine.id + " empty");
              activeEngineName = engine.name;
              engineHint.textContent = "翻译：" + engine.name;
              return result;
            }).catch(function (err) {
              skippedEngines[engine.id] = true;
              setTimeout(function () {
                delete skippedEngines[engine.id];
              }, 120000);
              throw err;
            });
          });
        });

        return chain.catch(function () {
          engineHint.textContent = "翻译暂时失败";
          throw new Error("all engines failed");
        });
      }

      function speak(text) {
        if (!speakToggle.checked || !text || !window.speechSynthesis) return;
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = speechCode(targetSel.value);
        utter.rate = 1.05;
        var voices = window.speechSynthesis.getVoices() || [];
        var langPrefix = utter.lang.slice(0, 2).toLowerCase();
        var voice = voices.filter(function (v) {
          return (v.lang || "").toLowerCase().indexOf(langPrefix) === 0;
        })[0];
        if (voice) utter.voice = voice;
        window.speechSynthesis.speak(utter);
      }

      function appendPair(src, dst) {
        if (emptyHint && emptyHint.parentNode) emptyHint.remove();
        emptyHint = null;
        var pair = document.createElement("div");
        pair.className = "pair";
        var srcLbl = document.createElement("div");
        srcLbl.className = "lbl";
        srcLbl.textContent = "原文 · " + langName(sourceSel.value);
        var srcEl = document.createElement("div");
        srcEl.className = "src";
        srcEl.textContent = src;
        var dstLbl = document.createElement("div");
        dstLbl.className = "lbl";
        dstLbl.style.marginTop = "10px";
        dstLbl.textContent = "译文 · " + langName(targetSel.value);
        var dstEl = document.createElement("div");
        dstEl.className = "dst";
        dstEl.textContent = dst;
        pair.appendChild(srcLbl);
        pair.appendChild(srcEl);
        pair.appendChild(dstLbl);
        pair.appendChild(dstEl);
        transcriptEl.appendChild(pair);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        lines.push({ src: src, dst: dst, from: langName(sourceSel.value), to: langName(targetSel.value) });
      }

      function formatTranscript() {
        return lines.map(function (line, i) {
          return (i + 1) + ".\n原文（" + line.from + "）：" + line.src + "\n译文（" + line.to + "）：" + line.dst;
        }).join("\n\n");
      }

      function resetLive(idleText) {
        liveBox.classList.add("idle");
        liveBox.classList.remove("has-text");
        liveSrc.textContent = idleText || "等待语音…";
        liveDst.textContent = "—";
        liveDst.classList.remove("pending");
        lastInterimText = "";
        lastInterimTranslation = "";
      }

      function showInterim(src, dst, pending) {
        liveBox.classList.remove("idle");
        liveBox.classList.add("has-text");
        liveSrc.textContent = src;
        liveDst.textContent = dst || "翻译中…";
        liveDst.classList.toggle("pending", !!pending);
      }

      function handleFinal(text) {
        var src = (text || "").trim();
        if (!src) return;
        var seq = ++translateSeq;
        translateText(src).then(function (dst) {
          if (seq < translateSeq && !running) return;
          appendPair(src, dst);
          speak(dst);
        }).catch(function () {
          appendPair(src, "（翻译失败，请检查网络后重试）");
        });
      }

      function scheduleInterimTranslate(text) {
        lastInterimText = text;
        showInterim(text, lastInterimTranslation || "翻译中…", true);
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          var snapshot = lastInterimText;
          if (!snapshot) return;
          var seq = ++translateSeq;
          translateText(snapshot).then(function (dst) {
            if (seq !== translateSeq && snapshot !== lastInterimText) return;
            if (lastInterimText === snapshot) {
              lastInterimTranslation = dst;
              showInterim(snapshot, dst, false);
            }
          }).catch(function () {
            if (lastInterimText === snapshot) {
              showInterim(snapshot, "翻译中…", true);
            }
          });
        }, 300);
      }

      function startRecognition() {
        if (!SpeechRecognition) {
          setStatus("error", "不支持识别");
          showError("当前浏览器不支持语音识别。请使用最新版 Chrome 或 Edge 打开本页面。");
          return;
        }
        showError("");
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        running = true;
        toggleBtn.textContent = "停止同传";
        toggleBtn.classList.add("stop");
        setStatus("listening", "正在聆听");
        resetLive("正在听，请开始说话…");

        if (!recognition) {
          recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;

          recognition.onresult = function (event) {
            var interim = "";
            var i;
            for (i = event.resultIndex; i < event.results.length; i++) {
              var piece = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                handleFinal(piece);
                lastInterimTranslation = "";
              } else {
                interim += piece;
              }
            }
            if (interim.trim()) {
              scheduleInterimTranslate(interim.trim());
            } else {
              resetLive("正在听…");
            }
          };

          recognition.onerror = function (event) {
            var err = event.error;
            if (err === "not-allowed" || err === "service-not-allowed") {
              running = false;
              setStatus("error", "麦克风被拒绝");
              showError("无法使用麦克风，请在浏览器地址栏允许麦克风权限后再试。");
              stopUiOnly();
              return;
            }
            if (err === "audio-capture") {
              running = false;
              setStatus("error", "找不到麦克风");
              showError("没有检测到可用的麦克风，请检查设备后重试。");
              stopUiOnly();
              return;
            }
            if (err === "network") {
              showError("语音识别需要联网，当前网络似乎不可用。");
              setStatus("error", "网络异常");
              return;
            }
            if (err === "no-speech" || err === "aborted" || err === "canceled") {
              return;
            }
          };

          recognition.onend = function () {
            if (!running) return;
            if (restartTimer) clearTimeout(restartTimer);
            restartTimer = setTimeout(function () {
              if (!running || !recognition) return;
              try {
                recognition.lang = speechCode(sourceSel.value);
                recognition.start();
                setStatus("listening", "正在聆听");
              } catch (e) {
                // Already started, ignore.
              }
            }, 200);
          };
        }

        try {
          recognition.lang = speechCode(sourceSel.value);
          recognition.start();
        } catch (e) {
          try { recognition.stop(); } catch (e2) {}
          setTimeout(function () {
            if (!running || !recognition) return;
            try {
              recognition.lang = speechCode(sourceSel.value);
              recognition.start();
            } catch (e3) {
              running = false;
              stopUiOnly();
              setStatus("error", "无法启动");
              showError("无法启动语音识别。请使用 Chrome 或 Edge，并确保已允许麦克风权限。");
            }
          }, 250);
        }
      }

      function stopUiOnly() {
        toggleBtn.textContent = "开始同传";
        toggleBtn.classList.remove("stop");
        if (!errorBanner.classList.contains("show")) {
          setStatus("", "已停止");
        }
        resetLive("已停止。点击「开始同传」继续。");
      }

      function stopRecognition() {
        running = false;
        if (restartTimer) clearTimeout(restartTimer);
        if (debounceTimer) clearTimeout(debounceTimer);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (recognition) {
          try { recognition.stop(); } catch (e) {}
        }
        stopUiOnly();
      }

      toggleBtn.addEventListener("click", function () {
        if (running) stopRecognition();
        else startRecognition();
      });

      clearBtn.addEventListener("click", function () {
        lines = [];
        transcriptEl.innerHTML = "";
        emptyHint = document.createElement("div");
        emptyHint.className = "empty";
        emptyHint.id = "emptyHint";
        emptyHint.textContent = "记录已清空。开始说话后，原文和译文会显示在这里。";
        transcriptEl.appendChild(emptyHint);
      });

      copyBtn.addEventListener("click", function () {
        if (!lines.length) {
          showError("还没有可复制的记录。");
          setTimeout(function () { showError(""); }, 2500);
          return;
        }
        var text = formatTranscript();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            var prev = copyBtn.textContent;
            copyBtn.textContent = "已复制";
            setTimeout(function () { copyBtn.textContent = prev; }, 1500);
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        var prev = copyBtn.textContent;
        copyBtn.textContent = "已复制";
        setTimeout(function () { copyBtn.textContent = prev; }, 1500);
      }

      exportBtn.addEventListener("click", function () {
        if (!lines.length) {
          showError("还没有可导出的记录。");
          setTimeout(function () { showError(""); }, 2500);
          return;
        }
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, "0"); };
        var stamp =
          now.getFullYear() +
          pad(now.getMonth() + 1) +
          pad(now.getDate()) +
          "-" +
          pad(now.getHours()) +
          pad(now.getMinutes());
        var blob = new Blob(
          ["实时同传记录（" + now.toLocaleString("zh-CN") + "）\n\n" + formatTranscript() + "\n"],
          { type: "text/plain;charset=utf-8" }
        );
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "tongchuan-" + stamp + ".txt";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 0);
      });

      if (!SpeechRecognition) {
        setStatus("error", "不支持识别");
        showError("当前浏览器不支持语音识别。请使用最新版 Chrome 或 Edge 打开本页面。");
        toggleBtn.disabled = true;
      }

      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.addEventListener("voiceschanged", function () {
          window.speechSynthesis.getVoices();
        });
      }
    })();
  </script>
</body>
</html>
